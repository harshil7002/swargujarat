[build]
  functions = "netlify/functions"
  publish = "."

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Catch-all: serve index.html for any unknown route (prevents 404)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

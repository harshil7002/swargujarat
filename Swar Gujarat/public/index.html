<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swar Gujarat - ગુજરાતના સૂર, તમારી દુનિયા.</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css?v=29">
    <link rel="stylesheet" href="css/responsive.css?v=31">
</head>
<body>
    <!-- Background Elements -->
    <video class="site-background-video" id="site-bg-video" autoplay loop muted playsinline>
        <source src="assets/swar.mp4" type="video/mp4">
    </video>
    <div class="site-background" id="site-bg-image"></div>
    <div class="site-overlay"></div>
    
    <!-- Particle Canvas for subtle visualization -->
    <canvas id="particles-canvas"></canvas>

    <!-- Top Status Bar -->
    <div class="top-status-bar">
        <div class="status-clock" id="real-time-clock">5:22 pm</div>
        <div class="status-right" style="display: flex; align-items: center; gap: 20px;">
            <div class="status-online">
                <span class="online-dot"></span> <span id="online-count">39</span> online
            </div>
        </div>
    </div>

    <!-- Mobile Hero Title (Hidden on Desktop) -->
    <div class="mobile-hero-title">
        <h1 class="gujarati-text">સ્વર</h1>
        <h2 class="english-text">GUJARAT</h2>
        <div class="ornament-divider">
            <div class="line"></div>
            <div class="diamond"></div>
            <div class="line"></div>
        </div>
    </div>

    <!-- Main Player Section -->
    <main class="player-section">

        <!-- Categories Button (Mobile Only) -->
        <button id="category-toggle-btn" class="category-toggle-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h7"></path></svg>
            <span>Playlists</span>
        </button>

        <!-- Categories Glass Sidebar -->
        <div id="category-sidebar" class="category-sidebar">
            <h3 class="category-title">Playlists</h3>
            <div class="category-list" id="category-list">
                <button class="category-btn active" data-cat="All">All Songs</button>
                <button class="category-btn" data-cat="Garba">Garba</button>
                <button class="category-btn" data-cat="Gujarati Love">Gujarati Love</button>
                <button class="category-btn" data-cat="Gujarati Film Songs">Gujarati Film Songs</button>
                <button class="category-btn" data-cat="Gujarati Bhajan">Gujarati Bhajan</button>
                <button class="category-btn" data-cat="Mataji Songs">Mataji Songs</button>
                <button class="category-btn" data-cat="Krishna Songs">Krishna Songs</button>
                <button class="category-btn" data-cat="Wedding Songs">Wedding Songs</button>
            </div>
        </div>

        <!-- Floating Music Player -->
        <div class="pill-player" id="music-player">
            <div class="pill-player-inner">
                <!-- CD Cover -->
                <div class="cd-container" id="cd-container">
                    <img src="assets/covers/cover1.jpg" alt="Album Cover" class="player-cover" id="player-cover">
                    <div class="cd-hole"></div>
                </div>
                
                <!-- Details & Progress -->
                <div class="pill-track-info">
                    <h3 id="player-title">વહાલી દીકરી</h3>
                    <p id="player-artist">Kirtidan Gadhvi</p>
                    
                    <div class="pill-progress-container">
                        <div class="progress-bar-bg" id="progress-bar-bg">
                            <div class="progress-bar-fill" id="progress-bar-fill"></div>
                        </div>
                    </div>
                    <div class="pill-time">
                        <span id="current-time">0:00</span> <span id="total-time">4:32</span>
                    </div>
                </div>

                <!-- Controls -->
                <div class="pill-controls">
                    <button class="control-btn" id="prev-btn" aria-label="Previous">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2"></line></svg>
                    </button>
                    <button class="pill-play-btn" id="play-pause-btn" aria-label="Play/Pause">
                        <svg class="play-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                        <svg class="pause-icon" style="display:none;" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
                    </button>
                    <button class="control-btn" id="next-btn" aria-label="Next">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"></line></svg>
                    </button>
                </div>
            </div>

        </div>

        <!-- Up Next Card - Enhanced -->
        <div id="up-next-card" class="up-next-card">
            <div class="up-next-header">
                <p class="up-next-label">Up Next</p>
            </div>
            <div class="up-next-info">
                <img id="up-next-cover" src="" alt="Next" class="up-next-thumbnail">
                <div class="up-next-details">
                    <h4 id="up-next-title" class="up-next-title">Song</h4>
                    <p id="up-next-artist" class="up-next-artist">Artist</p>
                </div>
            </div>
        </div>

        <!-- Creator Watermark -->
        <div class="creator-watermark">
            Made BY Harshil ( Mr.RedStone )
        </div>
    </main>

    <!-- Invisible YouTube Player -->
    <audio id="main-audio"></audio>
    <div id="yt-player-container" style="position: absolute; width: 0; height: 0; overflow: hidden; left: -9999px;"></div>

    <script src="js/player.js?v=13"></script>
    <script src="js/app.js?v=18"></script>
</body>
</html>
